/* Incremental grid rendering: cards appended in batches as the user scrolls
   (#cat2-main is the scroll root), instead of building the full DOM at once. */
let __incIO = null;
function renderCardsIncremental(grid, items, htmlFn, opts){
  opts = opts || {};
  const BATCH = opts.batch || 40;
  if(__incIO){ __incIO.disconnect(); __incIO = null; }
  grid.innerHTML = "";
  if(items.length <= BATCH*1.5){
    grid.insertAdjacentHTML("beforeend", items.map(htmlFn).join(""));
    if(opts.onAppend) opts.onAppend(grid);
    if(opts.onDone) opts.onDone();
    return;
  }
  let idx = 0;
  const sentinel = document.createElement("div");
  sentinel.style.cssText = "grid-column:1/-1;height:1px;";
  function append(){
    if(!sentinel.parentNode) return;
    const slice = items.slice(idx, idx+BATCH);
    idx += slice.length;
    sentinel.insertAdjacentHTML("beforebegin", slice.map(htmlFn).join(""));
    if(opts.onAppend) opts.onAppend(grid);
    if(idx >= items.length && __incIO){ __incIO.disconnect(); __incIO = null; sentinel.remove(); }
    if(opts.onDone) opts.onDone();
  }
  grid.appendChild(sentinel);
  __incIO = new IntersectionObserver(function(entries){
    if(entries.some(e=>e.isIntersecting)) append();
  }, {root: opts.root || null, rootMargin: "800px 0px"});
  append();
  // Condensed↔Expanded restore: keep loading batches until the anchor card exists.
  if(opts.ensureId != null){
    const targetIdx = items.findIndex(
      it => !isGroupHeader(it) && Number(it.id) === Number(opts.ensureId)
    );
    if(targetIdx >= 0){
      while(idx <= targetIdx && idx < items.length) append();
    }
  }
  if(__incIO && sentinel.parentNode) __incIO.observe(sentinel);
}

// ── Group by ──
// Workbook placeholders ("*", "-", "n/r", …) mean "no value": they join the blank group.
const GROUP_BLANK = new Set(["", "*", "-", "—", "n/a", "n/r", "na", "nr", "n/d", "none", "nan"]);
function groupValue(raw){
  const v = String(raw||"").trim().replace(/\s+/g, " ");
  return GROUP_BLANK.has(v.toLowerCase()) ? "" : v;
}
const GROUP_BY = {
  material:     {label: "Material Type", none: "(no material type)", key: p => groupValue(p.materialType)},
  manufacturer: {label: "Manufacturer",  none: "(no manufacturer)",  key: p => groupValue(p.manufacturer)},
  epd:          {label: "EPD Number",    none: "(no EPD number)",
                 key: p => groupValue(p.epdNumber) || groupValue(p.epdDeclaredNumber)},
};
/* Sorted rows → [{group, count}, row, row, …, {group, count}, row, …].
   Groups run A→Z with the blank group last; the current sort holds inside each. */
function groupRows(sorted){
  const g = GROUP_BY[groupBy];
  if(!g) return sorted;
  const buckets = new Map();
  for(const p of sorted){
    const k = g.key(p);
    // EPD numbers differ only by spacing/case in the source (S-P-01137 vs S-P- 01137).
    const id = groupBy === "epd" ? k.replace(/\s+/g, "").toUpperCase() : k.toLowerCase();
    if(!buckets.has(id)) buckets.set(id, {label: k, rows: []});
    buckets.get(id).rows.push(p);
  }
  const keys = [...buckets.keys()].sort((a, b) =>
    (a === "") - (b === "") || a.localeCompare(b, undefined, {numeric: true, sensitivity: "base"}));
  const out = [];
  for(const k of keys){
    const b = buckets.get(k);
    out.push({group: k === "" ? g.none : b.label, count: b.rows.length});
    out.push(...b.rows);
  }
  return out;
}

/* Keep the same library row / collection in view across Condensed↔Expanded.

function _anchorFromProductEl(el, main){
  if(!el || !main) return null;
  const p = findProduct(Number(el.dataset.id));
  if(!p) return null;
  const root = main.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return {
    parentId: p.parentId !== undefined ? Number(p.parentId) : Number(p.id),
    collectionId: p.collectionId || null,
    eetraId: String(p.eetraId || ""),
    entryId: Number(p.id),
    offsetFromTop: r.top - root.top,
  };

function captureViewportAnchor(){
  const main = document.getElementById("cat2-main");
  if(!main) return null;
  const root = main.getBoundingClientRect();
  const nodes = main.querySelectorAll(".cat2-card[data-id], .rv-table tbody tr[data-id]");
  for(const el of nodes){
    const r = el.getBoundingClientRect();
    if(r.bottom <= root.top + 4) continue;
    if(r.top >= root.bottom - 4) break;
    const anchor = _anchorFromProductEl(el, main);
    if(anchor) return anchor;
  }
  return null;
}

  const el = document.querySelector(

/** Re-render the grid after a width change (detail panel open/close) without jumping scroll.
 *  Pass ``anchor`` when you already captured it *before* the layout change (panel open). */
function renderGridPreservingScroll(preferId, after, anchor){
  if(viewMode !== "grid"){
    if(typeof after === "function") after();
    return;
  }
  const a = anchor
    || (preferId != null
      ? (captureCardAnchor(preferId) || captureViewportAnchor())
      : captureViewportAnchor());
  const ensureId = preferId != null
    ? Number(preferId)
    : (a && a.entryId != null ? Number(a.entryId) : null);
  render({
    ensureId,
    onAnchored: () => {
      restoreViewportAnchor(a, ensureId);
      if(typeof after === "function") after();
    },
  });
}
function resolveEntryModeAnchorId(anchor){
  if(!anchor) return null;
  const list = activeProducts();
  if(entryMode === "expanded"){
    if(anchor.collectionId){
      const hit = list.find(p =>
        String(p.collectionId || "") === String(anchor.collectionId) &&
        (Number(p.parentId) === Number(anchor.parentId) ||
         Number(p.id) === Number(anchor.parentId) ||
         (anchor.eetraId && String(p.eetraId || "") === anchor.eetraId))
      );
      if(hit) return hit.id;
    }
    const child = list.find(p => Number(p.parentId) === Number(anchor.parentId));
    if(child) return child.id;
    const same = list.find(p => Number(p.id) === Number(anchor.parentId));
    if(same) return same.id;
  } else {
    const parent = PRODUCTS.find(p => Number(p.id) === Number(anchor.parentId))
      || (anchor.eetraId
        ? PRODUCTS.find(p => String(p.eetraId || "") === anchor.eetraId)
        : null);
    if(parent) return parent.id;
  }
  if(anchor.eetraId){
    const byEid = list.find(p => String(p.eetraId || "") === anchor.eetraId);
    if(byEid) return byEid.id;
  }
  return null;
}
function restoreViewportAnchor(anchor, targetId){
  if(targetId == null) return;
  const main = document.getElementById("cat2-main");
  if(!main) return;
  const el = document.querySelector(
    `.cat2-card[data-id="${targetId}"], .rv-table tbody tr[data-id="${targetId}"]`
  );
  if(!el) return;
  const offset = (anchor && typeof anchor.offsetFromTop === "number")
    ? anchor.offsetFromTop : 12;
  const mainRect = main.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  main.scrollTop += (elRect.top - mainRect.top - offset);
}

function render(opts){
  opts = opts || {};
  updateSizeToolbarState();
  const filtered = getFiltered();
  const sorted   = getSorted(filtered);
  const grid     = document.getElementById("grid");
  grid.dataset.size = viewMode === "grid" ? sizeMode : "";
  const countEl  = document.getElementById("rv-count");
  const total    = activeProducts().length;
  countEl.textContent = filtered.length===total
    ? `${total.toLocaleString()} products`
    : `${filtered.length.toLocaleString()} of ${total.toLocaleString()} products`;

  if(viewMode==="grid"){
    const ncol = effectiveGridCols();
    grid.style.gridTemplateColumns = `repeat(${ncol}, minmax(0, 1fr))`;
    grid.className = "";
    if(!sorted.length){
      grid.innerHTML = `<div class="empty-msg">No products match the current filters.</div>`;
      notifyHeight(); return;
    }
    renderCardsIncremental(grid, groupRows(sorted), gridItemHTML, {
      root: document.getElementById("cat2-main"),
      onAppend: bindNewGridCards,
      onDone: notifyHeight,
      ensureId: opts.ensureId,
    });
  } else {
    grid.style.gridTemplateColumns = "";
    grid.className = "rv-list-panel";
    if(!sorted.length){
      grid.innerHTML = `<div class="empty-msg">No products match the current filters.</div>`;
      notifyHeight(); return;
    }
    grid.innerHTML = listTableHTML(groupRows(sorted));
    for(const th of grid.querySelectorAll(".rv-th-sort")){
      th.addEventListener("click", ()=>{
        const k = th.dataset.key;
        if(sortField===k) sortDir*=-1; else { sortField=k; sortDir=SORT_DEFAULT_DIR[k] || 1; }
        saveSort();
        render();
      });
    }
    for(const tr of grid.querySelectorAll("tbody tr[data-id]")){
      tr.addEventListener("click", ()=>openModal(Number(tr.dataset.id)));
    }
  }
  if(modalOpen !== null){
    const visible = getFiltered().some(p=>p.id===modalOpen);
    if(!visible || (viewMode === "grid" && sizeMode === "XL")) closeModal();
    else highlightProduct(modalOpen);
  }
  notifyHeight();
  if(typeof opts.onAnchored === "function"){
    requestAnimationFrame(() => requestAnimationFrame(opts.onAnchored));
  }
}

// Entries are built here, in the browser, from fields already present on the
// product record — no Streamlit rerun. PDFs the pipeline mirrors locally are
// served by Streamlit at /app/static/docs/<file> (see
// lib_doc_storage.fn_sync_static_doc_links), so the viewer just points an iframe
// at a URL. A rerun would re-serialise the whole catalogue, thumbnails included,
// which is what made the old base64 round trip slow.
//
// window.__DOC_PREVIEW__ is still honoured: it carries server-fetched bytes for
// documents that exist only as a remote URL (CAM / DoP / MSDS / recycled-content
// evidence are never downloaded by the pipeline), requested on demand.
const DOC_PREVIEW = window.__DOC_PREVIEW__ || null;
const CAN_EDIT_ITEM = !!window.__CAN_EDIT_ITEM__;

// kind → tab/list labels + the product field carrying the manufacturer's URL.
// `name` is the full document title shown in the list, `tag` the thumbnail stamp.
const DOC_KINDS = [
  {kind:"epd",  tag:"EPD",  name:"Environmental Product Declaration", urlField:"epdUrl"},
  {kind:"tech", tag:"TDS",  name:"Technical Data Sheet",              urlField:"techDetailsUrl"},
  // vocUrl, not vocUrlPrimary/vocUrlAlt: fn336 consolidates those two source
  // columns into one field and drops the originals before serialising.
  {kind:"voc",  tag:"VOC",  name:"VOC Emissions Certificate",         urlField:"vocUrl"},
  {kind:"cam",  tag:"CAM",  name:"CAM Compliance Declaration",        urlField:"camCompliance"},
  {kind:"dop",  tag:"DoP",  name:"Declaration of Performance",        urlField:"dopUrl"},
  {kind:"msds", tag:"SDS",  name:"Safety Data Sheet",                 urlField:"msdsUrl"},
  {kind:"rc",   tag:"RC",   name:"Recycled Content Declaration",      urlField:"recyclingUrl"},
];

function docCleanUrl(v){
  const s = String(v==null?"":v).trim();
  if(!s || s === "-" || /^(n\/?a|n\/?r|nan|no)$/i.test(s)) return "";
  return /^https?:\/\//i.test(s) ? s : "";
}

// One entry per document a product actually has. staticUrl set → previewable
// immediately from /app/static/docs/; otherwise it lives only on the
// manufacturer's site. Entries carry the file's size and retrieval date so the
// list can show them without downloading anything.
function buildDocEntries(p){
  const meta = p.docMeta || {};
  const out = [];
  const seen = {};   // collapse fields citing the same file (EPD == RC evidence)
  for(const spec of DOC_KINDS){
    const remote = docCleanUrl(p[spec.urlField]);
    const m = meta[spec.kind] || null;
    const staticUrl = (m && !m.bad) ? m.url : "";
    const notPdf = !!(m && m.bad);
    if(!remote && !m) continue;
    // Index under EVERY identifier the entry has — one kind may be recognised by
    // its mirrored file and another only by its URL while both point at the same
    // document (863 rows share E__EPD_URL with R__Rec_Reco_ByProd_URL). Must match
    // fn357_build_doc_panel_payload's rule, or the two disagree about which kinds
    // exist and a server-fetched preview arrives under a kind the list never shows.
    const keys = [(m && m.url) || "", remote].filter(Boolean);
    const dup = keys.map(k=>seen[k]).find(Boolean);
    if(dup){
      (dup.alsoLabels = dup.alsoLabels || []).push(spec.tag);
      continue;
    }
    const entry = {
      kind: spec.kind, tag: spec.tag, label: spec.name,
      url: remote, staticUrl: staticUrl, notPdf: notPdf,
      kb: m ? (m.kb || 0) : 0,
      ts: m ? (m.ts || "") : "",
    };
    for(const k of keys) seen[k] = entry;
    out.push(entry);
  }
  return out;
}

function docPanelEntries(){ return docEntries; }

// Server-fetched bytes for a remote-only document, if Python supplied them.
function docServerEntry(kind){
  if(!DOC_PREVIEW || !docPanelProduct) return null;
  if(String(DOC_PREVIEW.eetraId||"") !== String(docPanelProduct.eetraId||"")) return null;
  return (DOC_PREVIEW.docs || []).find(d=>d.kind===kind) || null;
}

// Revalu-style list: page glyph, document name, size/date, then actions.
function renderDocList(){
  const body = document.getElementById("cat2-doc-body");
  body.innerHTML = "";
  const list = document.createElement("div");
  list.className = "cat2-doc-list";

  for(const d of docPanelEntries()){
    const served  = docServerEntry(d.kind);
    // Previewable if bytes exist anywhere the server can reach: mirrored locally
    // (staticUrl), already fetched this run (dataUri), or already rendered (pages).
    const rendered = !!(served && served.pages && served.pages.length);
    const canView = !!(d.staticUrl || (served && served.dataUri) || rendered);

    const row = document.createElement("div");
    row.className = "cat2-doc-item" + (canView ? " cat2-doc-item--clickable" : "");

    const openPreview = (ev)=>{
      if(ev && ev.target && ev.target.closest(".cat2-doc-act")) return;
      if(!canView) return;
      if(rendered) openDocPopup(d.kind);
      else requestDocPreview(docPanelProduct ? docPanelProduct.eetraId : "", d.kind, null);
    };
    if(canView) row.addEventListener("click", openPreview);

    const thumb = document.createElement("div");
    thumb.className = "cat2-doc-thumb";
    thumb.innerHTML = `<span class="cat2-doc-thumb-tag">${esc(d.tag)}</span>`;
    row.appendChild(thumb);

    const info = document.createElement("div");
    info.className = "cat2-doc-info";

    const name = document.createElement("div");
    name.className = "cat2-doc-name";
    // One file can be cited by several fields (an EPD that is also the
    // recycled-content evidence); note it rather than listing it twice.
    name.textContent = d.label + ((d.alsoLabels && d.alsoLabels.length)
      ? " (also " + d.alsoLabels.join(", ") + ")" : "");
    info.appendChild(name);

    // Dates are the file's retrieval time, not the issue date the manufacturer
    // printed on it — say "Retrieved" so it can't be misread as the latter.
    const meta = document.createElement("div");
    meta.className = "cat2-doc-meta";
    if(d.kb){
      // Don't call it a PDF when the magic bytes say otherwise.
      meta.textContent = (d.notPdf ? "File · " : "PDF · ") + d.kb + " KB"
        + (d.ts ? " · Retrieved " + d.ts : "");
    }else{
      meta.textContent = "Hosted by the manufacturer";
    }
    info.appendChild(meta);

    if(d.notPdf){
      const warn = document.createElement("div");
      warn.className = "cat2-doc-warn";
      warn.textContent = "Stored file isn't a valid PDF — source URL likely wrong";
      info.appendChild(warn);
    }else if(d.fetchFailed){
      const warn = document.createElement("div");
      warn.className = "cat2-doc-warn";
      warn.textContent = d.fetchNote || "Couldn't retrieve this document.";
      info.appendChild(warn);
    }

    const acts = document.createElement("div");
    acts.className = "cat2-doc-acts";
    if(canView){
      const view = document.createElement("button");
      view.type = "button";
      view.className = "cat2-doc-act";
      view.textContent = "Preview";
      // Pages already rendered (the user is coming back to this document) — show
      // them straight away; otherwise it takes a round trip to Python to render.
      view.addEventListener("click", (ev)=>{
        ev.stopPropagation();
        rendered
          ? openDocPopup(d.kind)
          : requestDocPreview(docPanelProduct ? docPanelProduct.eetraId : "", d.kind, view);
      });
      acts.appendChild(view);
    }
    if(d.staticUrl){
      const dl = document.createElement("a");
      dl.className = "cat2-doc-act";
      dl.href = appStaticUrl(d.staticUrl);
      dl.download = "";
      dl.textContent = "Download";
      acts.appendChild(dl);
    }
    if(!canView && d.url && !d.notPdf && !d.fetchFailed){
      // Server-side fetch sidesteps the manufacturer's CORS/framing rules, but
      // costs a rerun — so it stays an explicit choice.
      const load = document.createElement("button");
      load.type = "button";
      load.className = "cat2-doc-act";
      load.textContent = "Load preview";
      load.addEventListener("click", ()=>{
        load.textContent = "Fetching…";
        load.disabled = true;
        requestDocsFromPython(docPanelProduct ? docPanelProduct.eetraId : "", d.kind);
      });
      acts.appendChild(load);
    }
    if(d.url){
      const src = document.createElement("a");
      src.className = "cat2-doc-act secondary";
      src.href = d.url; src.target = "_blank"; src.rel = "noopener noreferrer";
      src.textContent = "Source ↗";
      acts.appendChild(src);
    }
    info.appendChild(acts);
    row.appendChild(info);
    list.appendChild(row);
  }

  if(!docPanelEntries().length){
    const none = document.createElement("div");
    none.className = "cat2-doc-empty";
    none.textContent = "No documents are on file for this product.";
    list.appendChild(none);
  }
  body.appendChild(list);
}

// A server-side fetch came back with nothing usable. Annotate that row so the
// outcome is visible — otherwise the rerun just redraws the same list and the
// click looks like it did nothing.
function flagDocFetchFailed(kind){
  const entry = docPanelEntries().find(d=>d.kind===kind);
  if(!entry) return;
  entry.fetchFailed = true;
  const served = docServerEntry(kind);
  entry.fetchNote = (served && served.note)
    ? served.note
    : "Couldn't retrieve this document — the manufacturer's site refused the "
      + "request. Use Source ↗ to open it in a new tab.";
  if(detailTab === DOCS_TAB && !docPreviewKind) renderDocList();
}

// appOrigin / appStaticUrl — defined above (before cardHTML) for product images too.

// Popup preview for one document: page images in an overlay, detail panel stays
// on the document list. Images are rendered server-side (lib_ui.fn358_rasterize_pdf_pages).
function closeDocPopup(){
  docPreviewKind = null;
  const bg = document.getElementById("doc-popup-bg");
  const body = document.getElementById("doc-popup-body");
  if(bg){
    bg.classList.remove("open");
    bg.setAttribute("aria-hidden", "true");
  }
  if(body) body.innerHTML = "";
}

function openDocPopup(kind){
  const entry = docPanelEntries().find(d=>d.kind===kind);
  if(!entry) return;
  docPreviewKind = kind;
  const popupBody = document.getElementById("doc-popup-body");
  const popupBg = document.getElementById("doc-popup-bg");
  if(!popupBody || !popupBg) return;
  popupBody.innerHTML = "";
  buildDocPreviewContent(entry, popupBody, {inPopup:true});
  popupBg.classList.add("open");
  popupBg.setAttribute("aria-hidden", "false");
}

function buildDocPreviewContent(entry, body, opts){
  const inPopup = !!(opts && opts.inPopup);
  const served = docServerEntry(entry.kind);
  const pages = (served && served.pages) || [];

  const bar = document.createElement("div");
  bar.className = "cat2-doc-preview-bar";
  const back = document.createElement("button");
  back.type = "button";
  back.className = "cat2-doc-back";
  back.textContent = inPopup ? "Close" : "← Documents";
  back.addEventListener("click", ()=>{
    if(inPopup) closeDocPopup();
    else { docPreviewKind = null; showDetailTab(DOCS_TAB); }
  });
  bar.appendChild(back);
  const t = document.createElement("span");
  t.className = "cat2-doc-preview-title";
  t.textContent = entry.label;
  bar.appendChild(t);
  if(entry.staticUrl){
    const dl = document.createElement("a");
    dl.className = "cat2-doc-link";
    dl.href = appStaticUrl(entry.staticUrl); dl.download = "";
    dl.textContent = "Download";
    bar.appendChild(dl);
  }
  body.appendChild(bar);

  function renderMessage(text){
    const wrap = document.createElement("div");
    wrap.className = "cat2-doc-msg";
    const msg = document.createElement("div");
    msg.textContent = text;
    wrap.appendChild(msg);
    if(entry.url){
      const a = document.createElement("a");
      a.className = "cat2-doc-link";
      a.href = entry.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "Open " + entry.label + " ↗";
      wrap.appendChild(a);
    }
    body.appendChild(wrap);
    if(!inPopup) notifyHeight();
  }

  if(!pages.length){
    renderMessage((served && served.note)
      || "Couldn't render this document. Use Download or Source ↗ instead.");
    return;
  }

  const viewer = document.createElement("div");
  viewer.className = "cat2-pdf-viewer";
  const total = served.pageCount || pages.length;
  if(total > 1 || pages.length < total){
    const toolbar = document.createElement("div");
    toolbar.className = "cat2-pdf-toolbar";
    const pagerLabel = document.createElement("span");
    pagerLabel.className = "cat2-pdf-pager";
    pagerLabel.textContent = pages.length < total
      ? "First " + pages.length + " of " + total + " pages"
      : total + " pages";
    toolbar.appendChild(pagerLabel);
    viewer.appendChild(toolbar);
  }
  const pageWrap = document.createElement("div");
  pageWrap.className = "cat2-pdf-page-wrap";
  pages.forEach((src, i) => {
    const img = document.createElement("img");
    img.className = "cat2-pdf-page";
    img.src = src;
    img.alt = entry.label + " — page " + (i + 1);
    pageWrap.appendChild(img);
  });
  viewer.appendChild(pageWrap);
  body.appendChild(viewer);
  if(!inPopup) notifyHeight();
}

function showDetailTab(key){
  const details = document.getElementById("cat2-detail-body");

  const susBody = document.getElementById("cat2-sus-body");
  const collBody = document.getElementById("cat2-coll-body");

  // Collections tab is only offered when the product has covered collections;
  // if something asks for it anyway (stale state), fall back to Info.
  if(key === COLL_TAB && !productHasCollections(docPanelProduct)) key = DETAILS_TAB;

  detailTab = key;
  renderDetailTabs();

  if(key === DETAILS_TAB || key === COLL_TAB || key === TECH_TAB || key === SUS_TAB){
    closeDocPopup();
    docBody.hidden = true;
    docBody.innerHTML = "";
    details.hidden = key !== DETAILS_TAB;
    if(collBody) collBody.hidden = key !== COLL_TAB;
    techBody.hidden = key !== TECH_TAB;
    susBody.hidden = key !== SUS_TAB;
    if(key === COLL_TAB && docPanelProduct) renderCollectionsTab(docPanelProduct);
    if(key === TECH_TAB && docPanelProduct) renderTechDetailsTab(docPanelProduct);

  details.hidden = true;
  if(collBody){ collBody.hidden = true; collBody.innerHTML = ""; }
  techBody.hidden = true;
  susBody.hidden = true;
  docBody.hidden = false;
  renderDocList();
  if(docPreviewKind) openDocPopup(docPreviewKind);
  notifyHeight();
}

// Bridge to Python via libs/catalogue_bridge, which turns this postMessage into
// setComponentValue and thus an ordinary Streamlit rerun. Needed for previews
// (pages are rasterised server-side) and for documents that exist solely as a
// remote URL (fetched server-side, sidestepping the manufacturer's CORS rules).
//
// Deliberately NOT a query-param + location.reload(): this app builds its nav
// with st.navigation(), which has no per-page URL routing, so any hard reload
// bounces the user to the default page (Welcome).
function postToStreamlit(msg){
  try{ window.parent.postMessage(msg, "*"); }catch(_e){}
  // The bridge listens on the top window too, in case this iframe is nested
  // deeper than one level.
  try{ if(window.top !== window.parent) window.top.postMessage(msg, "*"); }catch(_e){}
}

// Which document the user asked Python to fetch. The rerun rebuilds this iframe
// from scratch, so the request has to outlive it — sessionStorage does, and being
// same-origin it is readable on the way back in.
const DOC_WANTED_KEY = "eetraCatalogueDocWanted";

function requestDocsFromPython(eetraId, kind){
  try{
    sessionStorage.setItem(DOC_WANTED_KEY,
      JSON.stringify({eetraId:String(eetraId||""), kind:String(kind||"")}));
  }catch(_e){}
  postToStreamlit({
    type: "eetra:viewDocuments",
    eetraId: String(eetraId||""),
    // Python rasterises just this document for the preview — it can't guess which
    // one from the id alone, and rendering all of them would be wasteful.
    kind: String(kind||""),
    nonce: Date.now(),
  });
}

// The kind requested before the last rerun, if it was for this product.
function takeRequestedDocKind(eetraId){
  try{
    const raw = sessionStorage.getItem(DOC_WANTED_KEY);
    if(!raw) return "";
    sessionStorage.removeItem(DOC_WANTED_KEY);
    const v = JSON.parse(raw);
    return String(v.eetraId||"") === String(eetraId||"") ? String(v.kind||"") : "";
  }catch(_e){ return ""; }
}

function viewDocuments(eetraId){
  // Fully client-side: locally mirrored PDFs are fetched by the iframe from
  // /app/static/docs/, so switching to a document tab costs no rerun at all.
  // Only a remote-only document needs Python, and then only on request (see the
  // "Load preview in app" button in showDetailTab).
  const p = PRODUCTS.find(x=>String(x.eetraId||"") === String(eetraId||""));
  if(!p) return;
  openDocTab(p, null);
}

// ── Filter-bar hierarchy ──
// Hide the fields a higher control level already owns (config-driven, so the
// split lives in Python next to the sidebar / catalogue controls rather than being
// duplicated here). A hidden field keeps its element, so its value stays "" and
// the filter predicate simply never matches on it.
function applyFilterBarConfig(){
  const cfg = CAT_CFG.filterBar || {};
  const hidden = new Set(cfg.hidden || []);
  document.querySelectorAll(".filter-field").forEach(function(el){
    const field = el.getAttribute("data-field");
    if(hidden.has(field)){
      el.hidden = true;
      const ctl = el.querySelector("input,select");
      if(ctl) ctl.value = "";
    }
  });
  const scope = document.getElementById("filter-scope");
  if(scope){
    if(cfg.scopeLabel === "") scope.hidden = true;
    else if(cfg.scopeLabel) scope.textContent = cfg.scopeLabel;
  }
}

// ── Init ──
(function init(){
  bindXLCardTabs();
  applyFilterBarConfig();
  if(!Object.keys(RANGE_COLLECTIONS).length) entryMode = "condensed";
  updateEntryToolbarState();
  { const gSel = document.getElementById("f-group");
    if(gSel.closest(".filter-field").hidden || !GROUP_BY[groupBy]) groupBy = "";
    gSel.value = groupBy; }
  saveGridFu();
  if(!SORT_KEYS[sortField]){ sortField = "product"; sortDir = 1; }
  saveSort();
  document.documentElement.style.setProperty("--cat2-viewport-h", IFRAME_HEIGHT + "px");
  const lay = JS2_FIELDS.layout || {};
  if(lay.card_column_gap_px != null)
    document.documentElement.style.setProperty('--cat2-card-col-gap', lay.card_column_gap_px + 'px');
  const _mlGap = lay.card_column_gap_px_ml != null ? lay.card_column_gap_px_ml : lay.card_column_gap_px;
  if(_mlGap != null)
    document.documentElement.style.setProperty('--cat2-card-col-gap-ml', _mlGap + 'px');
  if(lay.popup_column_gap_px != null)
    document.documentElement.style.setProperty('--cat2-popup-col-gap', lay.popup_column_gap_px + 'px');

  let pct = INITIAL_LOAD_PCT > 0 ? INITIAL_LOAD_PCT : 5;
  setLoadProgress(pct);
  const av = buildOptions();
  pct = Math.max(pct, 75);
  setLoadProgress(pct);
  rebuildSelects(av);
  pct = Math.max(pct, 90);
  setLoadProgress(pct);
  render();
  requestAnimationFrame(()=> setLoadProgress(100, true));
  // Auto-open product detail panel when navigated here from ECOportal JS, or
  // after the documents round trip (Python passes the same id as open_product).
  const _openProduct = window.__OPEN_PRODUCT__
    || (DOC_PREVIEW ? DOC_PREVIEW.eetraId : "");
  if(_openProduct){
    // activeProducts(), not PRODUCTS: in Expanded mode the row itself is not on
    // screen, so open the first of its collections instead of an entry that
    // render() would immediately close as invisible.
    const _match = activeProducts().find(p =>
      String(p.eetraId||"") === _openProduct ||
      String(p.epdNumber||"") === _openProduct ||
      String(p.epdDeclaredNumber||"") === _openProduct
    );
    if(_match) requestAnimationFrame(()=> openModal(_match.id));
  }
  // A preview request completed on the previous run — reopen the card on the
  // Documents tab, showing the document that was actually asked for (not merely
  // the first one that happens to have rendered).
  if(DOC_PREVIEW && DOC_PREVIEW.eetraId){
    const _dp = PRODUCTS.find(p=>String(p.eetraId||"") === String(DOC_PREVIEW.eetraId));
    const _wanted = takeRequestedDocKind(DOC_PREVIEW.eetraId);
    const _got = (DOC_PREVIEW.docs || []).find(
      d => d.kind === _wanted && d.pages && d.pages.length
    );
    if(_dp) requestAnimationFrame(()=>{
      openDocTab(_dp, _got ? _got.kind : null);
      // Nothing rendered — say why on the row instead of silently re-showing the
      // same list with no explanation.
      if(_wanted && !_got) flagDocFetchFailed(_wanted);
    });
  }
  let rt;
  window.addEventListener("resize", ()=>{
    clearTimeout(rt);
    rt = setTimeout(()=>{ if(viewMode==="grid") render(); notifyHeight(); }, 120);
  });
  window.addEventListener("load", ()=>setTimeout(notifyHeight, 200));
  // The loader may start this script after "load" has already fired.
  if(document.readyState === "complete") setTimeout(notifyHeight, 200);
})();
</script>
<script>
// ── Loader: start the main script once window.__DATA__ is present ──
// Rows are inlined by Python (window.__DATA__). A legacy __DATA_URL__ fetch
// path used to live here; it is gone because Community Cloud often answers
// those GETs with the SPA HTML shell.
(function(){
  function startMain(){
    const src = document.getElementById("cat2-main-script");
    const s = document.createElement("script");
    s.text = src ? src.textContent : "";
    document.body.appendChild(s);
  }
  if(!Array.isArray(window.__DATA__)){
    const msg = document.createElement("div");
    msg.style.cssText = "padding:12px 16px;margin:8px;border:1px solid #f5c2c7;background:#f8d7da;color:#842029;font:13px sans-serif;border-radius:6px";
    msg.textContent = "Catalogue data is missing from the page payload. Reload the page to retry.";
    document.body.insertBefore(msg, document.body.firstChild);
    window.__DATA__ = [];
  }
  startMain();
})();
</script>
